<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QuickFeed Login</title>

  <link rel="stylesheet" href="../css/style.css">

</head>

<body>

  <div class="container">

    <h1>QuickFeed</h1>

    <h2>Register</h2>

    <input
      id="registerEmail"
      placeholder="Email"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="Password"
    >

    <button onclick="register()">
      Register
    </button>

    <hr>

    <h2>Login</h2>

    <input
      id="loginEmail"
      placeholder="Email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <pre id="output"></pre>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>

</body>
</html>
