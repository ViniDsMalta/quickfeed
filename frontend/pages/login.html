<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickFeed - Access Portal</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-wrapper">

  <div class="hero-glow"></div>

  <div class="auth-card glass-panel">
    <div class="auth-header">
      <h1>QuickFeed</h1>
      <p>Collect feedback. Grow your brand.</p>
    </div>

    <div class="auth-tabs">
      <div id="tab-login" class="auth-tab active" onclick="switchTab('login')">Login</div>
      <div id="tab-register" class="auth-tab" onclick="switchTab('register')">Register</div>
    </div>

    <!-- Login Form -->
    <div id="form-login" class="auth-form-content active">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input id="loginEmail" type="email" placeholder="name@company.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button onclick="login()" class="primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        Sign In
      </button>
    </div>

    <!-- Register Form -->
    <div id="form-register" class="auth-form-content">
      <div class="form-group">
        <label for="registerEmail">Email Address</label>
        <input id="registerEmail" type="email" placeholder="name@company.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input id="registerPassword" type="password" placeholder="Min. 8 characters" autocomplete="new-password">
      </div>
      <button onclick="register()" class="secondary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        Create Account
      </button>
    </div>

    <pre id="output"></pre>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    function switchTab(type) {
      if (type === 'login') {
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-register').classList.remove('active');
        document.getElementById('form-login').classList.add('active');
        document.getElementById('form-register').classList.remove('active');
      } else {
        document.getElementById('tab-register').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('form-register').classList.add('active');
        document.getElementById('form-login').classList.remove('active');
      }
      
      const out = document.getElementById('output');
      if (out) {
        out.textContent = '';
        out.className = '';
      }
    }
  </script>

</body>
</html>
