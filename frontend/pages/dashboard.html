<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickFeed - Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="hero-glow"></div>

  <header class="container dashboard-header">
    <div class="logo-container">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z" fill="url(#logoGrad)" />
        <defs>
          <linearGradient id="logoGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366f1" />
            <stop offset="1" stop-color="#8b5cf6" />
          </linearGradient>
        </defs>
      </svg>
      <span class="logo-text">QuickFeed</span>
    </div>
    
    <div class="dashboard-user">
      <span class="badge badge-primary">Workspace</span>
      <button onclick="logout()" class="danger" style="padding: 8px 16px; font-size: 0.875rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Logout
      </button>
    </div>
  </header>

  <main class="container dashboard-grid">
    <!-- Left Column: Company Management -->
    <div style="display: flex; flex-direction: column; gap: 24px;">
      <!-- Create Company Card -->
      <section class="dashboard-pane glass-panel">
        <h2>Create Company</h2>
        <div class="form-group" style="margin-bottom: 8px;">
          <label for="companyName">Company Name</label>
          <input id="companyName" placeholder="e.g. Acme Corp">
        </div>
        <button onclick="createCompany()" class="primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Create Company
        </button>
        <pre id="output"></pre>
      </section>

      <!-- Your Companies Card -->
      <section class="dashboard-pane glass-panel">
        <h2>Your Companies</h2>
        <div id="companies">
          <!-- Dynamically filled -->
        </div>
      </section>
    </div>

    <!-- Right Column: Feedbacks Logs -->
    <section class="dashboard-pane glass-panel">
      <h2>Feedbacks</h2>
      <div id="feedbacks">
        <p style="color: var(--text-muted); font-style: italic; text-align: center; padding: 20px 0;">
          Select a company from the list to view its feedbacks.
        </p>
      </div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>

</body>
</html>
