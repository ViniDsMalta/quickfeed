<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickFeed - Leave Feedback</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="brand-wrapper">

  <div class="hero-glow"></div>

  <div class="brand-card glass-panel">
    <div style="display: flex; justify-content: center; margin-bottom: 20px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </div>

    <h1 id="companyName">Loading...</h1>
    <p id="companySlug" class="badge badge-slug" style="margin-top: 10px; margin-bottom: 30px;"></p>

    <div class="form-group">
      <label for="feedbackMessage">Your Feedback</label>
      <textarea id="feedbackMessage" placeholder="Tell us what you think, what we can improve, or what you liked..."></textarea>
    </div>

    <button onclick="sendFeedback()" class="primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
      Send Feedback
    </button>

    <pre id="output"></pre>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/company.js"></script>

</body>
</html>
