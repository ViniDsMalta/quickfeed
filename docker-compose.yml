services:

  postgres:
    image: postgres:17

    container_name: quickfeed-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: quickfeed

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: quickfeed-backend

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: postgres://postgres:123456@postgres:5432/quickfeed?sslmode=disable
      JWT_SECRET: sua_chave_super_secreta

    depends_on:
      - postgres
    
  nginx:
    image: nginx:latest

    container_name: quickfeed-nginx

    ports:
      - "80:80"

    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - backend

volumes:
  postgres_data: